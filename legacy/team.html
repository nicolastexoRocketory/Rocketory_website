<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Team | Rocketory</title>
  <meta name="description" content="Das Team hinter Rocketory in Bünde: die Menschen, die Webseiten für KMU in OWL planen, gestalten und umsetzen.">
  <link rel="canonical" href="https://rocketory.de/team">
  <link rel="stylesheet" href="assets/css/main.css?v=40">
</head>
<body>
<div class="rk-shell">
  <div class="rk rk-page-team">
    <div id="rk-nav-mount"></div>

    <section class="rk-team-stage" aria-label="Team">
      <div class="rk-inner rk-team-stage-inner">
      <div class="rk-team-cols">
        <article class="rk-team-col">
          <div class="rk-team-col-media" aria-hidden="true">
            <picture>
              <source type="image/webp" srcset="assets/images/team/team-member-1.webp">
              <img src="assets/images/team/team-member-1.jpg" alt="Klaus" width="900" height="1400" loading="eager" decoding="async">
            </picture>
          </div>
          <div class="rk-team-col-copy">
            <h2 class="rk-team-col-name">Klaus</h2>
            <p class="rk-team-col-role">s. Viralista</p>
          </div>
        </article>

        <article class="rk-team-col">
          <div class="rk-team-col-media" aria-hidden="true">
            <picture>
              <source type="image/webp" srcset="assets/images/team/team-member-2.webp">
              <img src="assets/images/team/team-member-2.jpg" alt="Giuliana" width="900" height="1400" loading="eager" decoding="async">
            </picture>
          </div>
          <div class="rk-team-col-copy">
            <h2 class="rk-team-col-name">Giuliana</h2>
            <p class="rk-team-col-role">s. Viralista</p>
          </div>
        </article>

        <article class="rk-team-col">
          <div class="rk-team-col-media" aria-hidden="true">
            <picture>
              <source type="image/webp" srcset="assets/images/team/team-member-3.webp">
              <img src="assets/images/team/team-member-3.jpg" alt="Artem" width="900" height="1400" loading="lazy" decoding="async">
            </picture>
          </div>
          <div class="rk-team-col-copy">
            <h2 class="rk-team-col-name">Artem</h2>
            <p class="rk-team-col-role">s. Viralista</p>
          </div>
        </article>

        <article class="rk-team-col">
          <div class="rk-team-col-media" aria-hidden="true">
            <picture>
              <source type="image/webp" srcset="assets/images/team/team-member-4.webp">
              <img src="assets/images/team/team-member-4.jpg" alt="Nicolas" width="900" height="1400" loading="lazy" decoding="async">
            </picture>
          </div>
          <div class="rk-team-col-copy">
            <h2 class="rk-team-col-name">Nicolas</h2>
            <p class="rk-team-col-role">Digital &amp; Webdesign Manager</p>
          </div>
        </article>
      </div>
      </div>
    </section>

    <div id="rk-footer-mount"></div>
  </div>
</div>
<script src="js/scroll.js"></script>
<script src="js/includes.js"></script>
<script src="js/nav.js"></script>
</body>
</html>
