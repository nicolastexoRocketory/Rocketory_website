<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Referenzen | Rocketory</title>
  <link rel="stylesheet" href="assets/css/main.css?v=11">
  <link rel="stylesheet" href="assets/css/references.css">
</head>
<body>
<div class="rk-shell">
  <div class="rk">
    <div id="rk-nav-mount"></div>

    <header class="rk-page-hero rk-page-hero--dark rk-page-hero--listing rk-page-hero--blog">
      <div class="rk-inner rk-page-hero-blog-inner">
        <p class="rk-page-kicker">Referenzen</p>
        <h1 class="rk-page-title">Ausgewählte <em>Projekte.</em></h1>
        <p class="rk-page-lead">Konkrete Beispiele mit Zielen, Umsetzung und Ergebnissen, ehrlich erzählt, ohne Agentur-Blabla. Mehr Learnings findest du unter <a href="blog.html" class="rk-text-link">Wissen</a>.</p>
      </div>
    </header>

    <section class="rk-ref-section rk-ref-section--dark" id="projekte">
      <div class="rk-inner">
        <div class="rk-post-filter" data-rk-post-filter role="toolbar" aria-label="Projekte filtern">
          <button type="button" class="rk-post-filter-btn is-active" data-filter="all" aria-pressed="true">Alle</button>
        </div>

        <p class="rk-post-filter-empty" data-rk-post-filter-empty hidden>Keine Projekte in dieser Kategorie.</p>

        <div class="rk-post-grid" data-rk-post-grid></div>
      </div>
    </section>

    <div id="rk-footer-mount"></div>
  </div>
</div>
<script src="js/scroll.js"></script>
<script src="js/includes.js"></script>
<script src="js/nav.js"></script>
<script src="js/readmore.js"></script>
<script src="js/referenzen.js"></script>
</body>
</html>
