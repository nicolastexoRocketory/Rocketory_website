<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Blog | Rocketory</title>
  <link rel="stylesheet" href="assets/css/main.css?v=11">
  <link rel="stylesheet" href="assets/css/references.css">
</head>
<body>
<div class="rk-shell">
  <div class="rk">
    <div id="rk-nav-mount"></div>

    <header class="rk-page-hero rk-page-hero--dark rk-page-hero--listing rk-page-hero--blog">
      <div class="rk-inner rk-page-hero-blog-inner">
        <p class="rk-page-kicker">Blog</p>
        <h1 class="rk-page-title">Was wir <em>unterwegs lernen.</em></h1>
        <p class="rk-page-lead">Praxiswissen zu Webdesign, SEO und digitalem Auftritt, aus echten Projekten, ehrlich erzählt. Von <a href="technologien.html#statisch" class="rk-text-link">statischem HTML</a> über <a href="technologien.html#wordpress" class="rk-text-link">WordPress</a> bis <a href="technologien.html#cms-payload" class="rk-text-link">CMS mit Next.js &amp; Payload</a>.</p>
      </div>
    </header>

    <section class="rk-ref-section rk-ref-section--dark" id="blog">
      <div class="rk-inner">
        <div class="rk-post-filter" data-rk-post-filter role="toolbar" aria-label="Beiträge filtern">
          <button type="button" class="rk-post-filter-btn is-active" data-filter="all" aria-pressed="true">Alle</button>
        </div>

        <p class="rk-post-filter-empty" data-rk-post-filter-empty hidden>Keine Beiträge in dieser Kategorie.</p>

        <div class="rk-post-grid" data-rk-post-grid></div>
      </div>
    </section>

    <div id="rk-footer-mount"></div>
  </div>
</div>
<script src="js/scroll.js"></script>
<script src="js/includes.js"></script>
<script src="js/nav.js"></script>
<script src="js/readmore.js"></script>
<script src="js/referenzen.js"></script>
</body>
</html>
